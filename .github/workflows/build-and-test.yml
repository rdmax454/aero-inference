name: Build and Test

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build and run all tests
        run: |
          set -e
          mkdir -p build
          FLAGS="-std=gnu++17 -Wall -Wextra -I core/include -I compiler/include"

          run_test() {
            name=$1
            shift
            echo "=== $name"
            g++ $FLAGS "tests/$name.cpp" "$@" -o "build/$name"
            "./build/$name"
          }

          run_test test_math core/src/MathBackend.cpp
          run_test test_tensor
          run_test test_network core/src/Network.cpp core/src/MathBackend.cpp
          run_test test_quantizer compiler/src/Quantizer.cpp
          run_test test_mnist_inference core/src/Network.cpp core/src/MathBackend.cpp compiler/src/JsonParser.cpp
          run_test test_mnist_batch_accuracy core/src/Network.cpp core/src/MathBackend.cpp compiler/src/JsonParser.cpp